---
# tasks file for roles/haproxy
- name: http
  ansible.builtin.package:
    name: httpie
    state: latest

- name: install HAProxy
  ansible.builtin.yum:
    name: haproxy
    state: latest

- name: enable HAProxy
  ansible.builtin.service:
    name: haproxy
    state: started

- name: configure haproxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg

- name: restart HAproxy
  ansible.builtin.service:
    name: haproxy
    state: restarted
