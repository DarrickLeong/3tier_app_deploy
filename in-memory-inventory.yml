---
- name: In-Memory inventory playbook
  hosts: workstation

  tasks:
    - name: Debug
      ansible.builtin.debug:
        msg: Testing Testing

    - name: Fetch Instance Info
      os_server_facts:
        cloud: openstack
      register: result

    - name: Add host
      ansible.builtin.add_host:
        name: "{{ item.public_v4 }}"
        group: "{{result.ansible_facts.openstack_servers}}"

    - name: Add host
      ansible.builtin.add_host:
        name: "{{ item.public_v4 }}"
        group: "{{result.ansible_facts.openstack_servers}}"
